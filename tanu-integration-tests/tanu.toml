[[projects]]
name = "docker"
# test_ignore entries under test_ignore:: are exercised by src/test_ignore.rs.
test_ignore = [
  "tanu_integration_tests::task_local::spawned_task_without_scope_current_panics",
  "tanu_integration_tests::test_ignore::ignored_test",
  "tanu_integration_tests::test_ignore::ignored_case::2",
  "tanu_integration_tests::test_ignore::ignored_all_cases",
  "tanu_integration_tests::test_ignore::ignored_module",
]
retry.count = 3
retry.min_delay = "100ms"

# Exercises test_only / test_ignore; see src/test_only.rs.
[[projects]]
name = "allowlist"
test_only = [
  "tanu_integration_tests::test_only::listed_test_runs",
  "tanu_integration_tests::test_only::listed_but_ignored_test_is_skipped",
  "tanu_integration_tests::test_only::listed_module",
]
test_ignore = ["tanu_integration_tests::test_only::listed_but_ignored_test_is_skipped"]
