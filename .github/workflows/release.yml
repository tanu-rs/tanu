name: Release

on:
  release:
    types: [released]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Publish tanu-derive to crates.io
        run: cargo publish --package tanu-derive
      - name: Publish tanu-core to crates.io
        run: cargo publish --package tanu-core
      - name: Publish tanu-tui to crates.io
        run: cargo publish --package tanu-tui
      - name: Publish tanu to crates.io
        run: cargo publish --package tanu
